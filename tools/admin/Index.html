<!DOCTYPE html>
<html lang="ru">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#252E56;--deep:#2D3B62;--teal:#4EB1C1;--blue:#2667A8;--gold:#E9B13F;--bg:#F0F6FF;--line:#D3DFEE;--muted:#56607D;--ok:#1E8A5A;--bad:#B3261E;--card:#fff;--r:16px;--sh:0 1px 2px rgba(37,46,86,.06),0 8px 24px rgba(37,46,86,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--navy);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:4px 12px 18px;letter-spacing:.01em}.brand small{display:block;font-weight:500;font-size:13px;color:#A9B6D6;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#D7DEF0;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}.nav.on{background:var(--teal);color:var(--navy);font-weight:700}
.nav i{font-style:normal;width:22px;text-align:center}
aside .grow{flex:1}.foot{font-size:13px;color:#A9B6D6;padding:8px 12px}
main{padding:28px clamp(16px,4vw,44px) 110px;max-width:1100px;width:100%}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}.lead{color:var(--muted);margin:0 0 24px}
h2{font-size:19px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid rgba(211,223,238,.6)}
.stat b{display:block;font-size:30px;line-height:1.1;margin:6px 0 2px}.stat small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:#E7EEF9;color:var(--deep)}
.pill.ok{background:#E3F5EC;color:var(--ok)}.pill.off{background:#F1F3F7;color:var(--muted)}.pill.warn{background:#FFF4DA;color:#8A5B00}.pill.bad{background:#FCE8E6;color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.dot.live{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,138,90,.5)}70%{box-shadow:0 0 0 8px rgba(30,138,90,0)}100%{box-shadow:0 0 0 0 rgba(30,138,90,0)}}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:#E7EEF9;color:var(--navy);transition:transform .12s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.main{background:var(--gold);color:var(--navy);box-shadow:0 4px 14px rgba(233,177,63,.35)}.btn.dark{background:var(--navy);color:#fff}.btn.ghost{background:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
label.f{display:block;font-weight:600;margin:14px 0 6px}label.f small{font-weight:400;color:var(--muted);margin-left:6px}
input.t,select.t,textarea.t{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;transition:border .15s,box-shadow .15s}
input.t:focus,select.t:focus,textarea.t:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(78,177,193,.18)}
textarea.t{min-height:88px;resize:vertical}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#C9D4E6;border-radius:99px;transition:background .2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(22px)}
.opt{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.opt:last-child{border:0}
.opt b{display:block}.opt small{color:var(--muted)}
table.pr{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:14px;border:1px solid var(--line)}
table.pr th,table.pr td{padding:10px;text-align:center;border-bottom:1px solid var(--line)}table.pr tr:last-child td{border-bottom:0}
table.pr th{background:#F6F9FE;font-size:14px;color:var(--deep)}table.pr td:first-child{font-weight:700;background:#F6F9FE}
table.pr input{width:100%;max-width:120px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:600}
table.pr input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(78,177,193,.2)}
table.pr input.warn{border-color:var(--gold);background:#FFFBEF}
.list .item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.list .item:last-child{border:0}
.item .tt{font-weight:600}.item small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#E7EEF9;color:var(--deep);text-transform:uppercase}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:600;cursor:pointer}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.day{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#FBFDFF}.day b{color:var(--blue)}
.view{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:var(--navy);color:#fff;padding:13px 20px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:all .3s;z-index:50;max-width:90vw;white-space:pre-line}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(28,38,66,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.ov.on{display:flex;animation:in .2s}
.dlg{background:#fff;border-radius:20px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,#E6EDF8 25%,#F3F7FD 50%,#E6EDF8 75%);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.hint{font-size:14px;color:var(--muted);background:#F6F9FE;border-radius:12px;padding:10px 14px;margin:10px 0}
.save{position:sticky;bottom:16px;display:flex;justify-content:flex-end;margin-top:18px}
a{color:var(--blue)}
aside{background:linear-gradient(180deg,#252E56 0%,#1C2642 60%,#1A4375 100%)}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8FA0C8;padding:14px 12px 4px;font-weight:700}
.nav.more{display:none}
.hello{background:linear-gradient(120deg,#1A4375 0%,#2D3B62 55%,#252E56 100%);color:#fff;border-radius:22px;padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden}
.hello:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(233,177,63,.45),transparent 70%)}
.hello h1{color:#fff;margin:0 0 4px}.hello p{margin:0;color:#C9D4EE}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px}.kpi b{display:block;font-size:24px;color:#fff}.kpi small{color:#C9D4EE}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.site{background:#fff;border-radius:18px;box-shadow:var(--sh);border:1px solid rgba(211,223,238,.7);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .2s}
.site:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(37,46,86,.06),0 14px 34px rgba(37,46,86,.1)}
.site .top{height:6px;background:var(--c,#4EB1C1)}.site .in{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.site .hd{display:flex;gap:12px;align-items:center}.site .em{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c,#4EB1C1) 18%,#fff);flex:none}
.site h3{margin:0;font-size:18px}.site .ab{color:var(--muted);font-size:14px;margin:0}
.site .meta{display:flex;gap:6px;flex-wrap:wrap}.site .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}.site .acts .btn{flex:1;justify-content:center;min-height:40px;padding:8px 12px;font-size:15px}
a.btn{text-decoration:none}.site .ch{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.q{border:0;background:#E7EEF9;color:var(--deep);width:30px;height:30px;border-radius:50%;font-weight:700;cursor:pointer;vertical-align:middle;margin-left:8px;font-size:15px}
.hello .q{background:rgba(255,255,255,.15);color:#fff}
.todo .item b{display:block}.todo .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:17px}
.gl .item img{width:64px;height:48px;object-fit:cover;border-radius:10px;background:var(--bg)}
code.kb{background:#0F172A;color:#E2E8F0;display:block;padding:14px;border-radius:12px;font-size:13px;white-space:pre-wrap;overflow-x:auto}
@media (max-width:820px){
  .sec,.nav.x{display:none}.nav.more{display:flex}
  .hello{padding:20px;border-radius:18px}.sites{grid-template-columns:1fr}
  .gl .list .item>div{flex:1 1 calc(100% - 80px)}.gl .list .item>a.btn{flex:1 1 100%}.hello .kpis{grid-template-columns:1fr 1fr}
  .app{grid-template-columns:1fr}
  aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:30;justify-content:space-around;gap:0;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .brand,.foot,aside .grow{display:none}
  .nav{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;justify-content:center;text-align:center}.nav i{font-size:20px;width:auto}
  h1{font-size:23px}main{padding-top:20px}
  table.pr th,table.pr td{padding:7px 4px}table.pr input{padding:8px 2px}
  .list .item{flex-wrap:wrap}.list .item>div{flex:1 1 60%;min-width:0}.list .item .sp{display:none}.list .item>.btn{flex:1}
  .save{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">King Wings<small>Админка сайта</small></div>
    <button class="nav on" data-v="hub"><i>⌂</i><span>Главная</span></button>
    <div class="sec">🧭 Сайт программ</div>
    <button class="nav x" data-v="home"><i>◎</i><span>Обзор</span></button>
    <button class="nav" data-v="prices"><i>$</i><span>Цены</span></button>
    <button class="nav" data-v="progs"><i>▤</i><span>Программы</span></button>
    <button class="nav x" data-v="pins"><i>🔑</i><span>PIN агентов</span></button>
    <button class="nav x" data-v="sales"><i>✓</i><span>Продажи</span></button>
    <button class="nav x" data-v="google"><i>G</i><span>Google</span></button>
    <div class="sec">Другие сайты</div>
    <button class="nav" data-v="gallery"><i>📸</i><span>Галерея</span></button>
    <button class="nav" data-v="groups"><i>✈</i><span>Группы</span></button>
    <button class="nav x" data-v="sites"><i>◫</i><span>Все сайты</span></button>
    <div class="grow"></div>
    <button class="nav x" data-v="key"><i>⚙︎</i><span>Ключ</span></button>
    <button class="nav more" data-v="more"><i>☰</i><span>Ещё</span></button>
    <div class="foot">Изменения на сайте через 2–3 минуты после «Сохранить». Нажмите <b>?</b> рядом с заголовком — подсказка простыми словами.</div>
  </aside>
  <main id="m"><div class="skel"></div></main>
</div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<script>
const LN={en:'English',id:'Bahasa Indonesia',tr:'Türkçe',es:'Español',hi:'हिन्दी'},LANGS=['en','id','tr','es','hi'];
const CN={KZ:'Казахстан',UZ:'Узбекистан',KG:'Кыргызстан',TJ:'Таджикистан',TM:'Туркменистан'};
const GUESTS=['10','15','20','25','30','40'],COLS=[['3','bo','3★ · завтраки'],['3','fb','3★ · полное питание'],['4','bo','4★ · завтраки'],['4','fb','4★ · полное питание']];
let S=null,H=null,view='hub',cur=null,curLang='en',dirty=false;
const $=s=>document.querySelector(s),m=$('#m');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function call(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(e))[fn](...a))}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='toast on'+(bad?' bad':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',bad?6000:2800)}
function err(e){const s=String(e&&e.message||e);if(s.indexOf('NO_TOKEN')>=0){go('key');return}toast(s,1)}
function dlg(html){$('#dlg').innerHTML=html;$('#ov').classList.add('on')}function close_(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){if(dirty&&!confirm('Есть несохранённые изменения. Уйти без сохранения?'))return;dirty=false;view=v;cur=null;close_();
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(b.dataset.v==='more'&&MORE.some(x=>x[0]===v))));render();window.scrollTo(0,0)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

async function load(force){if(S&&!force)return S;m.innerHTML='<div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
 try{if(!await call('api_hasToken')){go('key');return null}S=await call('api_state');return S}catch(e){err(e);return null}}
async function render(){
 if(view==='key')return vKey();
 if(view==='groups')return vGroups();
 if(view==='hub')return vHub();
 if(view==='sites')return vSites();
 if(view==='gallery')return vGallery();
 if(view==='more')return vMore();
 if(view==='pins')return vPins();
 if(view.indexOf('site:')===0)return vSite(view.slice(5));
 if(!await load())return;
 ({home:vHome,prices:vPrices,progs:vProgs,sales:vSales,google:vGoogle})[view]()}

function buildPill(){const b=S.build;if(!b)return'';
 if(b.status!=='completed')return'<span class="pill warn"><span class="dot live"></span>Сайт обновляется…</span>';
 return b.result==='success'?'<span class="pill ok"><span class="dot"></span>Сайт обновлён '+new Date(b.at).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span>':'<span class="pill bad"><span class="dot"></span>Ошибка сборки — <a href="'+esc(b.url)+'" target="_blank">открыть</a></span>'}

function vHome(){const st=S.settings.data,P=S.programs,vis=P.filter(p=>!p.hidden),pr=vis.filter(p=>p.prices).length,L=S.live||{};
 const now=(L.now||[]).map(x=>(CN[x.c]||x.c)+(x.city?' ('+x.city+')':'')+(x.guests?', '+x.guests+' гостей':'')).join(' · ');
 m.innerHTML=`<div class="view"><div class="row"><div><h1>🧭 Сайт программ ${qb('home')}</h1><p class="lead">Сайт программ для агентов · <a href="${S.site}" target="_blank">открыть сайт ↗</a></p></div><div class="sp"></div>${buildPill()}</div>
 <div class="grid">
  <div class="card stat"><small>Программ на сайте</small><b>${vis.length}</b><small>${P.length-vis.length?'скрыто: '+(P.length-vis.length):'все показаны'}</small></div>
  <div class="card stat"><small>Цены заполнены</small><b>${pr} из ${vis.length}</b><small>${st.show_prices?'показываются агентам':'агентам пока не видны'}</small></div>
  <div class="card stat"><small>Продажи</small><b style="font-size:22px">${st.show_book?'Бронь и цена':'Запрос цены'}</b><small>${st.pay_url?'оплата по ссылке включена':'оплата — по счёту'}</small></div>
  <div class="card stat"><small>Google</small><b style="font-size:22px">${st.index?'<span style="color:var(--ok)">Показывается</span>':'Скрыт'}</b><small>${st.index?'страницы в поиске':'до готовности цепочки продаж'}</small></div>
 </div>
 <div class="card" style="margin-top:16px"><div class="row"><span class="pill ${(L.now||[]).length?'ok':'off'}"><span class="dot ${(L.now||[]).length?'live':''}"></span>Сейчас в пути</span><span class="sp"></span><small style="color:var(--muted)">обновлено ${esc(L.updated||'—')}</small></div>
  <p style="margin:12px 0 0;font-weight:600">${(L.now||[]).length?esc(now):'Сейчас групп в пути нет'}</p><p style="margin:4px 0 0;color:var(--muted)">30 дней вперёд: ${(L.next30||{}).groups||0} групп(ы)</p></div>
 <div class="card" style="margin-top:16px"><h2>Что сделать дальше</h2>${next(st,vis,pr)}</div></div>`;
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function next(st,vis,pr){const t=[];
 if(pr<vis.length)t.push(['Вписать цены — '+(vis.length-pr)+' программ без цен','prices']);
 if(pr&&!st.show_prices)t.push(['Включить показ цен агентам','sales']);
 if(!st.bank_show)t.push(['Добавить реквизиты банка (USD)','sales']);
 if(!st.index&&st.show_prices&&st.show_book)t.push(['Цепочка продаж готова — можно показать сайт в Google','google']);
 return t.length?'<div class="list">'+t.map(x=>`<div class="item"><span class="tt">${esc(x[0])}</span><span class="sp"></span><button class="btn" data-go="${x[1]}">Открыть →</button></div>`).join('')+'</div>':'<p>Всё готово 🎉</p>'}

/* ---------- Цены ---------- */
async function vPrices(){const vis=S.programs;
 m.innerHTML=`<div class="view"><h1>Цены${qb('prices')}</h1><p class="lead">Цена за 1 человека в USD для агента. Чем больше группа — тем ниже цена. Пустую строку можно не заполнять.</p>
 <div class="card"><label class="f">Программа</label><select class="t" id="ps">${vis.map(p=>`<option value="${esc(p.path)}">${esc(p.title)}${p.hidden?' (скрыта)':''}${p.prices?' ✓':''}</option>`).join('')}</select>
 <div id="pt" style="margin-top:18px"><div class="skel"></div></div></div></div>`;
 const sel=$('#ps');if(cur&&cur.path)sel.value=cur.path;sel.onchange=()=>{if(dirty&&!confirm('Не сохранено. Переключить?')){sel.value=cur.path;return}dirty=false;openPrices(sel.value)};openPrices(sel.value)}
async function openPrices(path){try{cur=await call('api_program',path)}catch(e){return err(e)}const pr=cur.data.prices||{};
 $('#pt').innerHTML=`<div style="overflow-x:auto"><table class="pr"><tr><th>Гостей</th>${COLS.map(c=>`<th>${c[2]}</th>`).join('')}</tr>
 ${GUESTS.map(g=>`<tr><td>от ${g}</td>${COLS.map(c=>{const v=((pr[c[0]]||{})[c[1]]||{})[g];return`<td><input inputmode="numeric" data-h="${c[0]}" data-m="${c[1]}" data-g="${g}" value="${v==null?'':v}" placeholder="—"></td>`}).join('')}</tr>`).join('')}</table></div>
 <div class="hint">Пример: 25 гостей, 4★ с полным питанием — агент увидит цену из строки «от 25». Если строки нет — берётся ближайшая меньшая.</div>
 <div class="save"><button class="btn ghost" id="pclr">Очистить</button>&nbsp;<button class="btn main" id="psv">Сохранить цены</button></div>`;

function googlePill(x){const st=x.settingsData;if(x.kind==='guides')return'<span class="pill off">🔒 Закрыт PIN</span>';
 if(st&&'index' in st)return st.index?'<span class="pill ok">G в поиске</span>':'<span class="pill off">G скрыт</span>';return''}
const UNIT={programs:['программа','программы','программ'],gallery:['группа','группы','групп'],guides:['путеводитель','путеводителя','путеводителей']};
function plural(n,f){const a=n%10,b=n%100;return f[(a===1&&b!==11)?0:(a>=2&&a<=4&&(b<10||b>=20))?1:2]}
function manage(x){return x.kind==='programs'?'home':x.kind==='gallery'?'gallery':x.kind==='guides'?'groups':'site:'+x.id}
async function loadHub(fresh){if(H&&!fresh)return H;try{if(!await call('api_hasToken')){go('key');return null}H=await call('api_sites',!!fresh);return H}catch(e){err(e);return null}}
async function vHub(fresh){m.innerHTML='<div class="hello"><h1>Загружаю…</h1><p>Собираю данные со всех сайтов</p></div><div class="sites"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
 if(!await loadHub(fresh))return;const L=H.live||{},hr=new Date().getHours(),hi=hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
 const now=(L.now||[]),nowT=now.map(x=>(CN[x.c]||x.c)+(x.city?' · '+x.city:'')).join(', ');
 m.innerHTML=`<div class="view"><div class="hello"><h1>${hi}, Атабек! ${qb('hub')}</h1><p>${new Date().toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})} · сайтов: ${H.sites.length} · проверено ${ago(H.at)} · <a href="#" id="rf" style="color:#E9B13F">обновить</a></p>
  <div class="kpis"><div class="kpi"><small>Сейчас в пути</small><b>${now.length} ${plural(now.length,['группа','группы','групп'])}</b><small>${esc(nowT)||'—'}</small></div>
  <div class="kpi"><small>Следующие 30 дней</small><b>${(L.next30||{}).groups||0}</b><small>подтверждённых групп</small></div>
  ${H.sites.filter(x=>x.count!=null).map(x=>`<div class="kpi"><small>${esc(x.emoji||'')} ${esc(x.name)}</small><b>${x.count}</b><small>${plural(x.count,UNIT[x.kind]||['шт','шт','шт'])}</small></div>`).join('')}</div></div>
 <div class="sites">${H.sites.map((x,k)=>`<div class="site" style="--c:${esc(x.color||'#4EB1C1')}"><div class="top"></div><div class="in">
  <div class="hd"><div class="em">${esc(x.emoji||'◫')}</div><div><h3>${esc(x.name)}</h3><div class="meta" style="margin-top:4px">${sitePill(x)}${googlePill(x)}</div></div></div>
  <p class="ab">${esc(x.about||x.error||'')}</p>
  ${x.changed?`<div class="ch">✎ изменено ${ago(x.changed.at)}: ${esc(x.changed.msg).slice(0,80)}</div>`:''}
  <div class="acts">${x.url?`<a class="btn ghost" href="${esc(x.url)}" target="_blank">Открыть ↗</a>`:''}<button class="btn dark" data-m="${k}">Управлять →</button></div></div></div>`).join('')}</div>
 <div class="card todo" style="margin-top:18px"><h2>Что сделать дальше</h2>${todoAll()}</div></div>`;
 $('#rf').onclick=e=>{e.preventDefault();vHub(true)};
 m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go(manage(H.sites[b.dataset.m])));
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function todoAll(){const t=[];H.sites.forEach(x=>{
  if(x.build&&x.build.result&&x.build.result!=='success')t.push(['🔴','#FCE8E6',x.name+': последняя сборка не прошла','Откройте и посмотрите причину',x.build.url,1]);
  if(x.error)t.push(['⚠️','#FFF4DA',x.name+': паспорт сайта с ошибкой',x.error,'sites']);
  if(x.kind==='programs'&&x.settingsData){const st=x.settingsData;
   if(!st.show_prices)t.push(['💲','#FFF4DA','Вписать цены и включить их показ','Без цен агент не может купить сразу','prices']);
   if(!st.bank_show)t.push(['🏦','#E7EEF9','Добавить реквизиты банка (USD)','Чтобы агент мог оплатить депозит','sales']);
   if(!st.index&&st.show_prices&&st.show_book)t.push(['🔎','#E3F5EC','Цепочка продаж готова — открыть сайт для Google','','google'])}});
 if(!t.length)return'<p>Всё в порядке 🎉</p>';
 return'<div class="list">'+t.map(x=>`<div class="item"><span class="ic" style="background:${x[1]}">${x[0]}</span><div><b>${esc(x[2])}</b><small>${esc(x[3])}</small></div><span class="sp"></span>${x[5]?`<a class="btn" href="${esc(x[4])}" target="_blank">Подробнее ↗</a>`:`<button class="btn" data-go="${x[4]}">Открыть →</button>`}</div>`).join('')+'</div>'}

async function vSite(id){if(!await loadHub())return;const x=H.sites.find(s=>s.id===id);if(!x)return go('hub');
 m.innerHTML=`<div class="view"><button class="btn ghost" onclick="go('hub')">← Главная</button>
 <div class="row" style="margin:14px 0 6px"><span class="em" style="font-size:30px">${esc(x.emoji||'◫')}</span><h1 style="margin:0">${esc(x.name)}</h1><span class="sp"></span>${sitePill(x)}${googlePill(x)}</div><p class="lead">${esc(x.about||'')}</p>
 <div class="card"><h2>Ссылки</h2><div class="list">${[[ 'Сайт',x.url]].concat((x.links||[]).map(l=>[l.t,l.u])).filter(l=>l[1]).map(l=>`<div class="item"><div><b>${esc(l[0])}</b><small style="display:block">${esc(l[1])}</small></div><span class="sp"></span><button class="btn ghost" data-ping="${esc(l[1])}">Проверить</button><a class="btn" href="${esc(l[1])}" target="_blank">Открыть ↗</a></div>`).join('')}</div></div>
 ${(x.help||[]).length?`<div class="card" style="margin-top:16px"><h2>Как с этим работать</h2><ol style="margin:0;padding-left:20px;line-height:1.8">${x.help.map(h=>`<li>${esc(h)}</li>`).join('')}</ol></div>`:''}
 ${x.settings?`<div class="card" style="margin-top:16px"><h2>Настройки</h2><div id="sf"><div class="skel"></div></div></div>`:''}
 <div class="hint">Где лежит: репозиторий <b>${esc(x.repo)}</b> · паспорт <b>${esc(x.file)}</b>${x.changed?' · изменено '+ago(x.changed.at):''}</div></div>`;
 m.querySelectorAll('[data-ping]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='…';try{const r=await call('api_ping',b.dataset.ping);b.textContent=r.code>=200&&r.code<400?'✓ '+r.code+' · '+r.ms+' мс':'✗ '+(r.code||'нет ответа');b.style.color=r.code>=200&&r.code<400?'var(--ok)':'var(--bad)'}catch(e){err(e)}b.disabled=false});
 if(x.settings)siteSettings(x)}
async function siteSettings(x){let c;try{c=await call('api_siteSettings',x.repo,x.settings)}catch(e){return err(e)}const box=$('#sf');if(!c){box.innerHTML='<p>Файла настроек нет.</p>';return}
 const keys=Object.keys(c.data).filter(k=>['boolean','string','number'].includes(typeof c.data[k])&&!/key|token|secret|pass/i.test(k));
 box.innerHTML=keys.map(k=>typeof c.data[k]==='boolean'?`<div class="opt"><label class="sw"><input type="checkbox" data-k="${k}" ${c.data[k]?'checked':''}><span></span></label><b>${esc(k)}</b></div>`:`<label class="f">${esc(k)}</label><input class="t" data-k="${k}" value="${esc(c.data[k])}">`).join('')+'<div class="save" style="position:static"><button class="btn main" id="ssv2">Сохранить</button></div>';
 box.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>dirty=true));
 $('#ssv2').onclick=async()=>{const d=JSON.parse(JSON.stringify(c.data));box.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;d[k]=i.type==='checkbox'?i.checked:typeof c.data[k]==='number'?+i.value:i.value});
  try{const r=await call('api_saveSiteSettings',x.repo,x.settings,c.sha,d);c.sha=r.sha;c.data=d;dirty=false;H=null;toast('Сохранено ✓')}catch(e){err(e)}}}

async function vGallery(){if(!await loadHub())return;const x=H.sites.find(s=>s.kind==='gallery');
 if(!x){m.innerHTML='<div class="card">Галерея не найдена: нет паспорта kw-site.json.</div>';return}
 m.innerHTML=`<div class="view"><div class="row"><h1>📸 Галерея ${qb('gallery')}</h1><span class="sp"></span>${sitePill(x)}<a class="btn ghost" href="${esc(x.url)}" target="_blank">Открыть ↗</a></div><p class="lead">${esc(x.about)}</p><div class="card gl"><div class="skel"></div></div></div>`;
 let G;try{G=await call('api_gallery',x.repo,x.content)}catch(e){return err(e)}
 m.querySelector('.gl').innerHTML='<div class="list">'+G.map((g,k)=>`<div class="item">${g.example?'<span class="pill off">пример</span>':`<label class="sw" title="Показывать на сайте"><input type="checkbox" data-g="${k}" ${g.hidden?'':'checked'}><span></span></label>`}
  <div style="flex:1;min-width:0"><div class="tt">${esc(g.title)}</div><small>${esc(g.start)} – ${esc(g.end)} · ${g.pax||'?'} гостей из ${esc(g.city||'—')} · 📷 ${g.photos} · 🎬 ${g.videos} · ${g.words} слов</small></div>
  ${g.example?'':`<a class="btn ghost" href="${esc(x.url)}${esc(g.slug)}/" target="_blank">Страница ↗</a>`}</div>`).join('')+'</div><div class="hint">Новые группы добавляет таблица «Галерея сайта» или Claude. Скрытая группа исчезает с сайта через 2–3 минуты.</div>';
 m.querySelectorAll('[data-g]').forEach(i=>i.onchange=async()=>{const g=G[i.dataset.g];i.disabled=true;try{await call('api_galleryToggle',x.repo,g.path,!i.checked);toast(i.checked?'Группа будет показана ✓':'Группа скрыта ✓')}catch(e){i.checked=!i.checked;err(e)}i.disabled=false})}

async function vSites(){if(!await loadHub())return;
 m.innerHTML=`<div class="view"><h1>Все сайты ${qb('sites')}</h1><p class="lead">Админка сама находит сайты по «паспорту». Здесь — что найдено и как добавить новый.</p>
 <div class="card list">${H.sites.map(x=>`<div class="item"><span class="ic" style="background:color-mix(in srgb,${esc(x.color||'#4EB1C1')} 20%,#fff);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px">${esc(x.emoji||'◫')}</span><div><b>${esc(x.name)}</b><small style="display:block">${esc(x.repo)} / ${esc(x.file)}</small></div><span class="sp"></span>${sitePill(x)}<button class="btn" data-go="${manage(x)}">Управлять →</button></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h2>Репозитории</h2><p style="margin-top:-6px;color:var(--muted)">${H.repos.map(r=>`<b>${esc(r.name)}</b> — ${r.via==='key'?'по ключу':r.via==='public'?'открытый, без ключа':'нет доступа'}`).join(' · ')}</p></div>
 <div class="card" style="margin-top:16px"><h2>Как добавить новый сайт</h2><ol style="margin:0 0 12px;padding-left:20px;line-height:1.8"><li>В папке нового сайта (в любом репозитории kingwingstravel) положить файл <b>kw-site.json</b> — «паспорт».</li><li>Через 10 минут (или по кнопке «обновить» на главной) сайт появится здесь сам.</li><li>Если сайт в закрытом репозитории — дать ключу GitHub доступ к нему (раздел «Ключ»).</li></ol>
 <code class="kb">{
  "name": "Название сайта",
  "emoji": "🌐",
  "color": "#4EB1C1",
  "about": "Что это за сайт, одной фразой",
  "url": "https://адрес-сайта/",
  "kind": "page",
  "workflow": "имя сборки в GitHub Actions (если есть)",
  "settings": "папка/settings.json (если есть)",
  "order": 5,
  "help": ["Как с ним работать — шаг 1", "шаг 2"]
}</code></div></div>`;
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}

function vMore(){m.innerHTML=`<div class="view"><h1>Ещё</h1><div class="card list">${MORE.map(x=>`<div class="item"><span style="font-size:20px;width:28px;text-align:center">${x[1]}</span><b>${x[2]}</b><span class="sp"></span><button class="btn" data-go="${x[0]}">Открыть →</button></div>`).join('')}</div></div>`;
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}

/* ---------- PIN агентов ---------- */
function pinMsg(pin){const u=(S&&S.site)||'https://trip.kingwingstravel-dmc.com/programs/';
 return `King Wings Travel — your agent PIN: ${pin}\n\nOpen ${u} → choose a program → tap «See your price» → enter the PIN.\nThe PIN is personal, please do not share it.\n\nPIN agen King Wings Anda: ${pin}\nBuka ${u} → pilih paket → ketuk «Lihat harga Anda» → masukkan PIN. PIN bersifat pribadi, mohon tidak dibagikan.`}
async function vPins(){m.innerHTML=`<div class="view"><div class="row"><h1>🔑 PIN агентов ${qb('pins')}</h1><span class="sp"></span><button class="btn main" id="padd">＋ Выдать PIN</button></div><p class="lead">Цены на сайте видят только агенты с PIN. Цен в коде сайта нет.</p><div id="pb"><div class="skel"></div></div></div>`;
 $('#padd').onclick=addPin;let R;try{R=await call('api_pins')}catch(e){return err(e)}
 if(!S)try{S=await call('api_state')}catch(e){}
 const api=S&&S.settings&&S.settings.data.pin_api;
 $('#pb').innerHTML=`${api?'':'<div class="card" style="border-left:5px solid var(--gold)"><b>Цены по PIN пока выключены на сайте.</b><br><small>Впишите адрес скрипта «KW Цены по PIN» в разделе «Продажи».</small> <button class="btn" data-go="sales" style="margin-top:8px">Открыть «Продажи» →</button></div>'}
 <div class="grid" style="margin:16px 0"><div class="card stat"><small>PIN выдано</small><b>${R.pins.length}</b><small>включено: ${R.pins.filter(p=>p.on).length}</small></div>
 <div class="card stat"><small>Программ с ценами</small><b>${R.priced}</b><small><a href="#" id="psync">обновить цены в таблице</a></small></div>
 <div class="card stat"><small>Просмотров цен</small><b>${R.pins.reduce((a,p)=>a+p.count,0)}</b><small>всего</small></div></div>
 <div class="card list">${R.pins.length?R.pins.map((p,k)=>`<div class="item"><label class="sw" title="Включён"><input type="checkbox" data-k="${k}" ${p.on?'checked':''}><span></span></label>
  <div style="flex:1;min-width:0"><div class="row" style="gap:8px"><b style="font-family:monospace;font-size:18px;letter-spacing:.12em">${esc(p.pin)}</b><span class="tt">${esc(p.agent)}</span>${p.until&&p.until<new Date().toISOString().slice(0,10)?'<span class="pill bad">срок истёк</span>':''}</div>
  <small>${esc([p.country,p.contact].filter(Boolean).join(' · '))}${p.until?' · до '+esc(p.until):' · без срока'} · открытий: <b>${p.count}</b>${p.last?' · последний раз '+ago(p.last):''}</small></div>
  <button class="btn ghost" data-msg="${k}">Сообщение</button></div>`).join(''):'<p>PIN пока нет. Нажмите «Выдать PIN».</p>'}</div>
 <div class="card" style="margin-top:16px"><h2>Журнал (последние 40)</h2>${R.log.length?'<div class="list">'+R.log.map(l=>`<div class="item"><span class="pill ${/показаны/.test(l.res)?'ok':/нет/.test(l.res)?'warn':'bad'}">${esc(l.res)}</span><div><b>${esc(l.agent||'—')}</b> <small>${esc(l.pin)} · ${esc(l.prog)} · ${esc(l.lang)}</small></div><span class="sp"></span><small>${ago(l.at)}</small></div>`).join('')+'</div>':'<p style="color:var(--muted)">Пока пусто.</p>'}
 <p><a href="${esc(R.sheet)}" target="_blank">Открыть таблицу ↗</a></p></div>`;
 m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 $('#psync').onclick=async e=>{e.preventDefault();try{const n=await call('api_pricesSync');toast('Цены обновлены в таблице: '+n+' программ');vPins()}catch(x){err(x)}};
 m.querySelectorAll('.sw input').forEach(i=>i.onchange=async()=>{const p=R.pins[i.dataset.k];i.disabled=true;try{await call('api_pinSet',p.row,'on',i.checked);toast(i.checked?'PIN '+p.pin+' включён ✓':'PIN '+p.pin+' выключен — цены по нему больше не откроются')}catch(e){i.checked=!i.checked;err(e)}i.disabled=false});
 m.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>showMsg(R.pins[b.dataset.msg].pin))}
function showMsg(pin){dlg(`<h2>Сообщение для агента</h2><p style="color:var(--muted);margin-top:-4px">Скопируйте и отправьте в WhatsApp.</p><textarea class="t" id="pmt" style="min-height:220px">${esc(pinMsg(pin))}</textarea><div class="row" style="margin-top:12px"><button class="btn main" id="pcp">Скопировать</button><span class="sp"></span><button class="btn ghost" onclick="close_()">Закрыть</button></div>`);
 $('#pcp').onclick=()=>{const t=$('#pmt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Скопировано ✓')}}
function addPin(){dlg(`<h2>Выдать PIN</h2><label class="f">Агентство</label><input class="t" id="pa1" placeholder="PT Contoh Travel">
 <label class="f">Страна <small>необязательно</small></label><input class="t" id="pa2" placeholder="Indonesia">
 <label class="f">Контакт <small>WhatsApp или e-mail, необязательно</small></label><input class="t" id="pa3">
 <label class="f">Действует до <small>пусто — без срока</small></label><input class="t" id="pa4" type="date">
 <div class="row" style="margin-top:14px"><button class="btn main" id="pas">Выдать</button><span class="sp"></span><button class="btn ghost" onclick="close_()">Отмена</button></div>`);
 $('#pas').onclick=async()=>{$('#pas').disabled=true;try{const pin=await call('api_pinAdd',{agent:$('#pa1').value,country:$('#pa2').value,contact:$('#pa3').value,until:$('#pa4').value});showMsg(pin);toast('PIN '+pin+' выдан ✓');vPins()}catch(e){err(e);$('#pas').disabled=false}}}

render();
</script>
</body>
</html>
