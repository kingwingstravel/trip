<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F6FA;--card:#FFFFFF;--ink:#14213D;--muted:#4A5672;--line:#D5DDE8;--navy:#1A4375;--deep:#2D3B62;--teal:#4EB1C1;--tealText:#1A6B77;--light:#D3DFEE;--gold:#E9A93A;--goldSoft:#FDF1D8;--red:#A8321E;--green:#1E7A47;--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;font-size:1rem;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:6rem}
header{background:var(--navy);color:#fff;padding:1.1rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.logos{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;height:2.1rem;padding:0 .7rem;border:2px dashed rgba(255,255,255,.7);border-radius:.55rem;font-size:.9rem;font-weight:700}
.kw{font-weight:700;letter-spacing:.08em}
.sub{font-size:.9rem;color:var(--light)}
.iconbtn{font:inherit;min-width:3rem;min-height:3rem;border-radius:.8rem;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;cursor:pointer}
.band{height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 22px,var(--navy) 22px 26px,var(--teal) 26px 40px,var(--navy) 40px 44px)}
.hero{display:block;width:100%;aspect-ratio:400/240;object-fit:cover;background:var(--light)}
main{padding:1.1rem .9rem;display:flex;flex-direction:column;gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem}
h1{margin:0;font-size:1.45rem;line-height:1.2}
h2{margin:0 0 .6rem;font-size:1.2rem}
.small{font-size:.9rem;color:var(--muted)}
.lbl{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
.daynav{display:flex;align-items:center;gap:.6rem}
.daynav .t{flex:1;text-align:center;min-width:0}
.arrow{font:inherit;width:3.1rem;height:3.1rem;flex:0 0 auto;border-radius:.9rem;border:2px solid var(--navy);background:#fff;color:var(--navy);font-size:1.3rem;font-weight:700;cursor:pointer}
.arrow:disabled{border-color:var(--line);color:#8A94A8;cursor:default}
.now{background:var(--navy);color:#fff;border-radius:1.2rem;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem}
.pill{align-self:flex-start;background:var(--gold);color:var(--ink);font-weight:700;font-size:.9rem;padding:.2rem .8rem;border-radius:999px}
.bigtime{font-size:2.4rem;font-weight:700;line-height:1}
.now .place{color:var(--light);font-size:.95rem}
.warn{background:var(--goldSoft);border:2px solid var(--gold);border-radius:1rem;padding:.9rem 1rem}
.warn b{display:block;font-size:1.05rem}
.countdown{background:var(--light);border-radius:1rem;padding:.9rem 1rem;font-weight:600}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:3.4rem 1.6rem minmax(0,1fr);column-gap:.45rem}
.plan .tm{font-weight:700;font-variant-numeric:tabular-nums}
.knot{display:flex;flex-direction:column;align-items:center}
.knot span{width:1rem;height:1rem;border-radius:50%;border:3px solid var(--navy);background:#fff;margin-top:.3rem}
.knot i{flex:1;border-left:3px dashed var(--teal);min-height:1.2rem}
.plan li:last-child .knot i{display:none}
.plan .tx{padding-bottom:1rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.3rem;border-radius:1rem;font:inherit;font-size:1.05rem;font-weight:700;text-decoration:none;cursor:pointer;width:100%;padding:0 1rem;text-align:center}
.btn.primary{background:var(--navy);color:#fff;border:0}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.soft{background:var(--light);color:var(--ink);border:0}
.btn.share{background:var(--gold);color:var(--ink);border:0;flex-direction:column;gap:0;min-height:4rem}
.btn.share small{font-size:.8rem;font-weight:500}
.btn.wa{background:var(--green);color:#fff;border:0}
.btn.sos{background:var(--red);color:#fff;border:0;min-height:4rem;justify-content:flex-start;padding:0 1.1rem}
.person{display:flex;align-items:center;gap:.8rem}
.avatar{width:3.3rem;height:3.3rem;border-radius:50%;background:var(--light);color:var(--navy);font-weight:700;font-size:1.4rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.daylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
.dayitem{font:inherit;color:inherit;text-align:left;width:100%;display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:.8rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:1rem;padding:0;overflow:hidden;cursor:pointer}
.dayitem img{width:6.2rem;height:100%;min-height:4.8rem;object-fit:cover;display:block}
.dayitem .b{padding:.6rem .7rem .6rem 0}
.dayitem.cur{border:2px solid var(--gold)}
.dayitem .k{font-size:.85rem;color:var(--muted)}
.dayitem .n{font-size:1.02rem;font-weight:700;line-height:1.25}
.tag{display:inline-block;margin-top:.3rem;font-size:.8rem;font-weight:600;background:var(--goldSoft);color:#6B4600;padding:.1rem .6rem;border-radius:999px}
dl{margin:0}
dl div{padding:.7rem 0;border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{font-size:.9rem;color:var(--muted)}
dd{margin:0;font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 .3rem .6rem}
.tab{font:inherit;background:none;border:0;border-top:4px solid transparent;color:var(--muted);font-size:.85rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0 .2rem;min-height:3.6rem;cursor:pointer}
.tab svg{width:1.5rem;height:1.5rem}
.tab[aria-current="page"]{color:var(--navy);font-weight:700;border-top-color:var(--gold)}
.overlay{position:fixed;inset:0;background:#fff;z-index:10;display:none;flex-direction:column;overflow:auto}
.overlay.open{display:flex}
.overlay.dark{background:#0E1830}
.ovtop{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:1rem;background:var(--bg);border-bottom:1px solid var(--line)}
.dark .ovtop{background:transparent;border:0;color:#fff}
.ovbody{padding:1.5rem 1.3rem;display:flex;flex-direction:column;gap:1.1rem;max-width:520px;margin:0 auto;width:100%}
.taxi1{font-size:1.35rem;color:var(--deep);margin:0}
.taxi2{font-size:2.2rem;font-weight:700;line-height:1.15;margin:0}
.seg{display:flex;flex-direction:column;gap:.6rem}
.opt{font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:1rem;min-height:3.6rem;padding:.5rem 1rem;border-radius:1rem;border:2px solid var(--line);background:#fff;cursor:pointer}
.opt[aria-checked="true"]{border:3px solid var(--gold);background:var(--goldSoft)}
.opt .aa{width:2.6rem;text-align:center;font-weight:700;color:var(--navy)}
.sharecard{width:100%;max-width:340px;margin:0 auto;border-radius:1rem;display:block;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff}
.sheet{background:#fff;border-radius:1.3rem 1.3rem 0 0;padding:1.2rem 1rem 1.6rem;margin-top:auto;display:flex;flex-direction:column;gap:.8rem;max-width:520px;width:100%;align-self:center}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.app{font:inherit;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.35rem;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;padding:.2rem 0}
.app span{width:3.3rem;height:3.3rem;border-radius:1rem;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;font-weight:700}
.thanks{background:var(--navy);color:#fff;padding:1.2rem 1.1rem}
.strip{display:grid;grid-template-columns:repeat(5,1fr)}
.strip img{width:100%;height:3.6rem;object-fit:cover;display:block}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.vote button{font:inherit;min-height:3.4rem;border:2px solid var(--line);border-radius:1rem;background:#fff;font-weight:700;font-size:1.05rem;color:var(--ink);cursor:pointer}
.vote button[aria-pressed="true"]{border:3px solid var(--gold);background:var(--goldSoft)}
.next{background:#E3F3F5;border:2px solid var(--teal);border-radius:1rem;padding:1rem}
.pilot{font-size:.85rem;color:var(--muted);text-align:center;padding:0 1rem}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:.8rem;font-size:.9rem;z-index:20;display:none;max-width:90%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hrow">
    <span class="logos" id="logos"></span>
    <button class="iconbtn" id="openSettings" aria-label="Aa">Aa</button>
  </div>
  <div class="sub" id="tripline"></div>
</header>
<div class="band" aria-hidden="true" id="band"></div>
<div id="heroBox"></div>
<main id="app"></main>
<p class="pilot" id="pilotNote"></p>
</div>

<nav class="tabs" aria-label="Menu"><div class="in" id="tabs"></div></nav>

<div class="overlay" id="taxi" role="dialog" aria-modal="true" aria-labelledby="taxiTitle">
  <div class="ovtop"><b id="taxiTitle"></b><button class="btn ghost" style="width:auto;min-height:3rem" data-close="taxi" id="taxiClose"></button></div>
  <div class="ovbody">
    <p class="taxi1">Здравствуйте! Отвезите меня, пожалуйста, по адресу:</p>
    <p class="taxi2" id="taxiAddr"></p>
    <p style="margin:0;font-size:1.5rem;font-weight:600" id="taxiName"></p>
  </div>
</div>

<div class="overlay dark" id="share" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
  <div class="ovtop"><span></span><button class="btn ghost" style="width:auto;min-height:3rem" data-close="share" id="shareClose"></button></div>
  <div style="padding:0 1.2rem"><img class="sharecard" id="shareImg" alt=""></div>
  <div class="sheet">
    <h2 id="shareTitle" style="margin:0"></h2>
    <div class="small" id="shareSub"></div>
    <div class="apps">
      <a class="app" id="shWa" href="https://wa.me/" target="_blank" rel="noopener" style="text-decoration:none"><span style="background:var(--green)">W</span>WhatsApp</a>
      <button class="app" id="shNative"><span style="background:#8A2F62">◎</span>Instagram</button>
      <button class="app" id="shSave"><span style="background:var(--navy)">↓</span><b id="shSaveL" style="font-weight:600"></b></button>
    </div>
    <div class="small" id="shareSafe"></div>
  </div>
</div>

<div class="overlay" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="ovtop"><b id="setTitle"></b><button class="btn ghost" style="width:auto;min-height:3rem" data-close="settings" id="setClose"></button></div>
  <div class="ovbody">
    <h2 id="sizeTitle"></h2>
    <div class="seg" role="radiogroup" id="sizes"></div>
    <h2 id="langTitle" style="margin-top:.6rem"></h2>
    <div class="seg" role="radiogroup" id="langs"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

 <button class="btn ghost" data-open="settings">Aa · ${l.settings}</button>`;
}
function vAfter(){
 const l=L(),v=store.get(P+"vote",null);
 return `<section class="card"><div class="lbl">${l.photos}</div>${G.photos?`<a class="btn primary" href="${esc(G.photos)}">${l.photos}</a>`:`<div class="small">${l.photosSoon}</div>`}</section>
 <section class="card"><h2 style="margin:0">${l.how}</h2><div class="small">${l.howSub}</div><div class="vote"><button data-vote="up" aria-pressed="${v==="up"}">${l.yes}</button><button data-vote="down" aria-pressed="${v==="down"}">${l.no}</button></div>${v?`<div class="small" style="margin-top:.5rem">${l.voted}</div>`:""}</section>
 <section class="next"><div class="lbl" style="color:var(--tealText)">${l.nextL}</div><div style="font-size:1.3rem;font-weight:700;line-height:1.2">${l.nextT}</div><div class="small" style="margin:.3rem 0 .8rem">${l.nextS}</div><a class="btn wa" id="askAgent" href="https://wa.me/?text=${encodeURIComponent(l.askText)}">${l.ask}</a></section>
 <button class="btn share" id="shareTrip" style="min-height:3.4rem">${l.shareTrip}</button>
 ${diff>-DAYS.length?`<button class="btn ghost" id="closeAfter">${l.back}</button>`:""}`;
}
const V={today:vToday,days:vDays,hotel:vHotel,help:vHelp};
function stripIdx(){const n=DAYS.length;if(n<=5)return DAYS.map((d,i)=>i);return [0,1,2,3,4].map(k=>Math.round(k*(n-1)/4))}
function renderHero(){
 const hb=document.getElementById("heroBox"),l=L();
 if(S.after){hb.innerHTML=`<div class="strip" aria-hidden="true">${stripIdx().map(i=>`<img src="${img(i)}" alt="">`).join("")}</div><div class="thanks"><h1 style="font-size:1.7rem">${l.thanks}</h1><div style="color:var(--light);margin-top:.3rem">${l.thanksSub}</div></div>`;document.getElementById("band").style.display="none";return}
 document.getElementById("band").style.display="";
 hb.innerHTML=S.tab==="today"?`<img class="hero" src="${img(S.day)}" alt="">`:"";
}
function render(){
 const l=L();
 document.documentElement.lang=S.lang;
 document.documentElement.style.setProperty("--fs",S.size+"px");
 renderLogo();
 document.getElementById("tripline").textContent=tripLine();
 document.getElementById("pilotNote").textContent=l.pilot;
 document.getElementById("tabs").innerHTML=["today","days","hotel","help"].map(k=>`<button class="tab" data-tab="${k}" ${!S.after&&S.tab===k?'aria-current="page"':""}>${IC[k]}${l[k]}</button>`).join("");
 renderHero();
 document.getElementById("app").innerHTML=S.after?vAfter():V[S.tab]();
 document.getElementById("taxiTitle").textContent=l.taxiTitle;
 document.getElementById("taxiClose").textContent=l.close;
 document.getElementById("shareClose").textContent=l.close;
 document.getElementById("shareTitle").textContent=l.shareTitle;
 document.getElementById("shareSub").textContent=l.shareSub;
 document.getElementById("shareSafe").textContent=l.shareSafe;
 document.getElementById("shSaveL").textContent=l.save;
 document.getElementById("setTitle").textContent=l.settings;
 document.getElementById("setClose").textContent=l.close;
 document.getElementById("sizeTitle").textContent=l.size;
 document.getElementById("langTitle").textContent=l.lang;
 document.getElementById("sizes").innerHTML=[[18,l.normal,"100%",22],[22,l.large,"125%",28],[27,l.xl,"150%",34]].map(s=>`<button class="opt" role="radio" aria-checked="${S.size===s[0]}" data-size="${s[0]}"><span class="aa" style="font-size:${s[3]}px">Aa</span><span><b>${s[1]}</b><br><span class="small">${s[2]}</span></span></button>`).join("");
 document.getElementById("langs").innerHTML=LANGS.map(x=>`<button class="opt" role="radio" aria-checked="${S.lang===x}" data-lang="${x}"><b>${LANGNAME[x]||x}</b></button>`).join("");
}
/* ---- share picture: drawn on the phone, nothing loaded in advance ---- */
let shareBlob=null,shareText="";
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function wrapText(c,t,x,y,max,lh){const w=t.split(" ");let line="";for(const word of w){const test=line?line+" "+word:word;if(c.measureText(test).width>max&&line){c.fillText(line,x,y);line=word;y+=lh}else line=test}c.fillText(line,x,y);return y}
async function makeCard(im0,kicker,title,date){
 const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
 g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);
 const im=await loadImg(im0);g.drawImage(im,0,0,W,648);
 const f="'Golos Text',system-ui,sans-serif";
 g.fillStyle="#4A5672";g.font=`700 40px ${f}`;g.fillText(kicker.toUpperCase(),72,740);
 g.fillStyle="#14213D";g.font=`700 84px ${f}`;let y=wrapText(g,title,72,850,936,96);
 g.fillStyle="#4A5672";g.font=`400 44px ${f}`;g.fillText(date,72,y+80);
 g.fillStyle="#1A4375";g.font=`600 40px ${f}`;g.fillText(`King Wings Travel · ${TAG}`,72,y+150);
 g.fillStyle="#1A4375";g.fillRect(0,H-150,W,150);
 g.fillStyle="#FFFFFF";
 g.font=`700 44px ${f}`;g.textAlign="right";g.fillText("KING WINGS",W-60,H-58);g.textAlign="left";
 return new Promise(ok=>c.toBlob(b=>ok(b),"image/jpeg",.9));
}
async function openShare(kind){
 const l=L();let im,kick,title,date;
 if(kind==="trip"){im=IMGLIB[G.tripImg]||img(DAYS.length-1);kick=l.tripCard(DAYS.length);title=G.route||COUNTRIES.map(cn).join(" · ");date=longRange()}
 else{const d=DAYS[S.day];im=img(S.day);kick=l.inPlace(S.day+1,d.place||"");title=tx(d.title);date=shortDate(S.day)}
 shareText=l.waText(title,date);
 document.getElementById("shWa").href="https://wa.me/?text="+encodeURIComponent(shareText);
 document.getElementById("share").classList.add("open");
 shareBlob=await makeCard(im,kick,title,date);
 document.getElementById("shareImg").src=URL.createObjectURL(shareBlob);
 document.getElementById("shareImg").alt=title;
}
async function nativeShare(){
 const file=new File([shareBlob],"king-wings-day.jpg",{type:"image/jpeg"});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:shareText});return}catch(e){return}}
 saveImg();
}
function saveImg(){const a=document.createElement("a");a.href=URL.createObjectURL(shareBlob);a.download="king-wings-day.jpg";document.body.appendChild(a);a.click();a.remove();toast(L().saved)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-tab],[data-day],[data-open],[data-close],[data-size],[data-lang],[data-vote],#prev,#next,#openSettings,#openShare,#shareTrip,#openAfter,#closeAfter,#shNative,#shSave");
 if(!el)return;
 if(el.dataset.tab){S.tab=el.dataset.tab;if(diff>-DAYS.length||el.dataset.tab!=="today")S.after=false;render();window.scrollTo(0,0)}
 else if(el.dataset.day!==undefined){S.day=+el.dataset.day;S.tab="today";S.after=false;render();window.scrollTo(0,0)}
 else if(el.dataset.open){if(el.dataset.tx!==undefined){const s=STAYS[+el.dataset.tx];document.getElementById("taxiAddr").textContent=s.taxiRu||"";document.getElementById("taxiName").textContent=s.nameRu||s.name||""}document.getElementById(el.dataset.open).classList.add("open")}
 else if(el.id==="openSettings"){document.getElementById("settings").classList.add("open")}
 else if(el.dataset.close){document.getElementById(el.dataset.close).classList.remove("open")}
 else if(el.dataset.size){S.size=+el.dataset.size;store.set(P+"size",S.size);render()}
 else if(el.dataset.lang){S.lang=el.dataset.lang;store.set(P+"lang",S.lang);render()}
 else if(el.dataset.vote){store.set(P+"vote",el.dataset.vote);render()}
 else if(el.id==="prev"&&S.day>0){S.day--;render()}
 else if(el.id==="next"&&S.day<DAYS.length-1){S.day++;render()}
 else if(el.id==="openShare"){openShare("day")}
 else if(el.id==="shareTrip"){openShare("trip")}
 else if(el.id==="openAfter"){S.after=true;render();window.scrollTo(0,0)}
 else if(el.id==="closeAfter"){S.after=false;S.tab="days";render();window.scrollTo(0,0)}
 else if(el.id==="shNative"){nativeShare()}
 else if(el.id==="shSave"){saveImg()}
});
document.addEventListener("change",e=>{if(e.target.dataset.ck===undefined)return;const i=+e.target.dataset.ck;let a=store.get(P+"ck",[]);a=e.target.checked?[...new Set([...a,i])]:a.filter(x=>x!==i);store.set(P+"ck",a)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".overlay.open").forEach(o=>o.classList.remove("open"))});
render();
</script>
