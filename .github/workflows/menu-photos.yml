name: Menu photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/menu/sources.json', 'tools/menu/fetch_photos.py', '.github/workflows/menu-photos.yml']
concurrency: { group: menu-photos, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow==11.* requests
      - run: python tools/menu/fetch_photos.py
      - name: Commit
        run: |
          git config user.name "menu-bot"; git config user.email "menu-bot@users.noreply.github.com"
          git add menu/img tools/menu/out || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "menu photos (auto)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
