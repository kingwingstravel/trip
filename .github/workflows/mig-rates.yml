name: MIG rates (menu)
on:
  workflow_dispatch:
  schedule:
    - cron: '7 2,5,8,11,14 * * *'   # 7:07–19:07 по Алматы, каждые 3 часа
concurrency: { group: mig-rates, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/menu/mig_rates.py
      - name: Commit
        run: |
          git config user.name "menu-bot"; git config user.email "menu-bot@users.noreply.github.com"
          git add menu/rates.js
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "menu: курс МиГ (auto)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
