name: Menu translate (RU→EN descriptions)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/menu/translate_desc.py
      - if: always()
        run: |
          git config user.name "kw-bot"; git config user.email "bot@kingwingstravel-dmc.com"
          git add tools/menu/tr_en.json && git commit -m "menu: EN descriptions (auto)" && git pull --rebase -q && git push || echo nothing
