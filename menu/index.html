<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>King Wings — Меню ресторанов</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1d1d1b; --mute:#77736b; --line:#e6e1d6;
  --brand:#0f3d3e; --brand2:#164f50; --gold:#c8963e; --soft:#eef3f2; --red:#b3402f;
}
*{box-sizing:border-box}
main{min-width:0}
body{overflow-x:hidden}
html,body{margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* header */
.top{background:var(--brand);color:#fff;padding:14px 24px 0}
.top-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.3px}
.brand small{display:block;font-weight:400;font-size:13px;opacity:.75}
.rtabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.rtab{border:0;background:transparent;color:#fff;opacity:.7;padding:12px 20px;border-radius:12px 12px 0 0;font-size:17px;font-weight:600;white-space:nowrap}
.rtab small{display:block;font-weight:400;font-size:12px;opacity:.8}
.rtab.on{background:var(--bg);color:var(--brand);opacity:1}
.rtab .dot{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--gold);color:#fff;font-size:12px;line-height:20px;text-align:center}

/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:18px 24px 40px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr);padding:12px 12px 110px}}

/* details */
.details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.details summary{list-style:none;padding:12px 16px;cursor:pointer;color:var(--mute);font-size:15px}
.details summary::-webkit-details-marker{display:none}
.details summary b{color:var(--ink)}
.dgrid{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr;gap:12px;padding:0 16px 16px}
@media(max-width:700px){.dgrid{grid-template-columns:1fr 1fr}}
.dgrid label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.dgrid input,.dgrid select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* sections */
.sec{scroll-margin-top:120px;margin-top:18px}
.sec h2{font-size:22px;margin:6px 0 10px;color:var(--brand)}
.sub{font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr;gap:8px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;align-items:stretch;min-height:96px;transition:box-shadow .15s,border-color .15s}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.ph{flex:0 0 128px;background:var(--soft);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:520px){.ph{flex-basis:96px}}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.cn{font-weight:600;font-size:16px;line-height:1.25}
.cw{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#f3e6cf;color:#7a5718;margin-right:4px;vertical-align:1px}
.tag.pk{background:#f6dcd7;color:var(--red)}
.cf{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;gap:8px}
.pr{font-weight:700;font-size:18px;white-space:nowrap}
.add{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px}
.add:hover{background:var(--brand2)}
.step{display:flex;align-items:center;border:1px solid var(--brand);border-radius:10px;overflow:hidden}
.step button{border:0;background:#fff;color:var(--brand);width:38px;height:38px;font-size:22px;line-height:1}
.step input{width:46px;height:38px;border:0;text-align:center;font-weight:700;font-size:17px;background:var(--soft);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-width:min(92vw,640px);max-height:75vh;border-radius:12px;background:#fff}
.zoom div{color:#fff;font-size:18px;font-weight:600;text-align:center}
[hidden]{display:none!important}
.empty{padding:40px;text-align:center;color:var(--mute)}

/* order panel */
.panel{position:sticky;top:14px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.ph1{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.ph1 h3{margin:0;font-size:20px}
.ph1 .meta{font-size:14px;color:var(--mute);margin-top:4px}
.lines{overflow:auto;padding:6px 18px;flex:1;min-height:60px}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln .n{font-weight:600;font-size:15px}
.ln .s{font-weight:700;white-space:nowrap;text-align:right}
.ln .c{grid-column:1/3;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.mini{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.mini button{border:0;background:#fff;width:28px;height:28px;font-size:17px;color:var(--brand)}
.mini span{min-width:28px;text-align:center;font-weight:700;color:var(--ink)}
.rm{border:0;background:transparent;color:var(--mute);margin-left:auto;font-size:13px;text-decoration:underline}
.noitems{color:var(--mute);padding:24px 0;text-align:center;font-size:15px}
.tot{padding:12px 18px;border-top:1px solid var(--line);background:#fbfaf7;border-radius:0 0 16px 16px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:15px}
.tr input{width:56px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;text-align:right;font-size:15px}
.tr.big{font-size:22px;font-weight:800;padding-top:8px;border-top:1px solid var(--line);margin-top:6px}
.tr.pp{color:var(--brand);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:10px;padding:10px;font-weight:600;font-size:14px}
.btn.pri{background:var(--brand);color:#fff}
.btn.wide{grid-column:1/3}
.btn.ghost{border-color:var(--line);color:var(--mute);font-weight:400}
.note{font-size:12px;color:var(--mute);margin-top:8px}

/* mobile */
.mbar{display:none}
@media(max-width:1000px){
  .panel{display:none;position:fixed;inset:auto 0 0 0;top:auto;max-height:85vh;border-radius:18px 18px 0 0;z-index:30;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
  .panel.open{display:flex}
  .mbar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:20;background:var(--brand);color:#fff;border-radius:14px;padding:14px 16px;align-items:center;justify-content:space-between;font-weight:600;border:0;font-size:16px}
  .shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .shade.open{display:block}
  .x{display:inline-block!important}
}
.x{display:none;float:right;border:0;background:transparent;font-size:26px;line-height:1;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.95}

/* print: only the order */
.printout{display:none}
@media print{
  body{background:#fff}
  .top,.wrap,.mbar,.shade,.toast{display:none!important}
  .printout{display:block;padding:10mm;font-size:13pt}
  .printout h1{font-size:18pt;margin:0 0 4mm}
  .printout table{width:100%;border-collapse:collapse}
  .printout td,.printout th{border-bottom:1px solid #ccc;padding:2mm 1mm;text-align:left}
  .printout td.r,.printout th.r{text-align:right}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">King Wings Travel<small>Меню ресторанов · для менеджера</small></div>
  </div>
  <nav class="rtabs" id="rtabs"></nav>
</header>

<div class="wrap">
  <main>
    <details class="details" id="det">
      <summary>✎ <b>Группа, дата, гостей</b> — по желанию</summary>
      <div class="dgrid">
        <label>Группа<input id="fGroup" placeholder="например, Sanjar 25 pax"></label>
        <label>Дата<input id="fDate" type="date"></label>
        <label>Приём пищи<select id="fMeal"><option value="">—</option><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Кофе-брейк</option></select></label>
        <label>Гостей<input id="fPax" type="number" min="0" inputmode="numeric" placeholder="0"></label>
      </div>
    </details>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Поиск блюда в этом ресторане…">
      <div class="chips" id="chips"></div>
    </div>
    <div id="menu"></div>
  </main>

  <aside class="panel" id="panel">
    <div class="ph1">
      <button class="x" id="closeP" aria-label="Закрыть">×</button>
      <h3 id="pTitle">Заказ</h3>
      <div class="meta" id="pMeta"></div>
    </div>
    <div class="lines" id="lines"></div>
    <div class="tot">
      <div class="tr"><span>Блюда и напитки</span><b id="tSum">0 ₸</b></div>
      <div class="tr"><span>Скидка, % <input id="fDisc" type="number" min="0" max="100" inputmode="decimal"></span><span id="tDisc">0 ₸</span></div>
      <div class="tr"><span>Обслуживание, % <input id="fSvc" type="number" min="0" max="100" inputmode="decimal"></span><span id="tSvc">0 ₸</span></div>
      <div class="tr big"><span>Итого</span><span id="tTot">0 ₸</span></div>
      <div class="tr pp" id="rowPP" hidden><span id="lPP">На человека</span><span id="tPP"></span></div>
      <div class="btns">
        <button class="btn pri wide" id="bRest">📋 Скопировать заказ для ресторана</button>
        <button class="btn" id="bPart">📋 Меню партнёру (EN)</button>
        <button class="btn" id="bPrint">🖨 Печать / PDF</button>
        <button class="btn ghost wide" id="bClear">Очистить этот заказ</button>
      </div>
      <div class="note">Цены — из меню ресторана в зале (база King Wings). Фото — с Glovo / Wolt, только для наглядности.</div>
    </div>
  </aside>
</div>

<button class="mbar" id="mbar"><span id="mCount">Заказ пуст</span><span id="mSum"></span></button>
<div class="shade" id="shade"></div>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom"><img id="zImg" alt=""><div id="zCap"></div></div>
<div class="printout" id="printout"></div>

function renderMenu(){

function calc(){
  const o=ord(S.r); let sum=0, lines=[];
  R().sections.forEach(sec=>sec.items.forEach(it=>{ const q=o.q[it.k]; if(q>0){ lines.push({it,q,s:q*it.p}); sum+=q*it.p; } }));
  const disc = sum*(+o.disc||0)/100, svc=(sum-disc)*(+o.svc||0)/100, tot=sum-disc+svc;
  const pax = parseInt(S.info.pax)||0;
  return {lines,sum,disc,svc,tot,pax,o};
}

  const i=S.info, p=[];

  if(parseInt(i.pax)) p.push(i.pax+' гост.');
  return p.join(' · ');
}

$('bRest').onclick=()=>copy(textRest());
$('bPart').onclick=()=>copy(textPartner());
$('bClear').onclick=()=>{ const o=ord(S.r); if(!Object.keys(o.q).length) return; if(!$('bClear').dataset.sure){ $('bClear').dataset.sure=1; $('bClear').textContent='Точно очистить? Нажмите ещё раз'; setTimeout(()=>{delete $('bClear').dataset.sure; $('bClear').textContent='Очистить этот заказ';},3000); return; } o.q={}; save(); delete $('bClear').dataset.sure; $('bClear').textContent='Очистить этот заказ'; renderAll(); };
$('bPrint').onclick=()=>{
  const c=calc(), r=R(); if(!c.lines.length){ toast('Сначала добавьте блюда'); return; }
  let h=`<h1>King Wings Travel — заказ · ${esc(r.name)}</h1><p>${esc(metaText())}</p><table><tr><th>Блюдо</th><th class="r">Кол-во</th><th class="r">Цена</th><th class="r">Сумма</th></tr>`;
  c.lines.forEach(l=>{ h+=`<tr><td>${esc(l.it.n)}${l.it.w?' <small>('+esc(l.it.w)+')</small>':''}</td><td class="r">${l.q}</td><td class="r">${plain(l.it.p)}</td><td class="r">${plain(l.s)}</td></tr>`; });
  h+=`</table><p>Блюда и напитки: <b>${plain(c.sum)} тг</b>${c.disc?`<br>Скидка ${c.o.disc}%: −${plain(c.disc)} тг`:''}${c.svc?`<br>Обслуживание ${c.o.svc}%: ${plain(c.svc)} тг`:''}<br><b style="font-size:16pt">Итого: ${plain(c.tot)} тг</b>${c.pax?`<br>На человека: ${plain(c.tot/c.pax)} тг`:''}</p><p>Просим проверить и подтвердить заказ.</p>`;
  $('printout').innerHTML=h; window.print();
};

$('zoom').onclick=()=>$('zoom').classList.remove('on');
// mobile sheet
$('mbar').onclick=()=>{ $('panel').classList.add('open'); $('shade').classList.add('open'); };
$('shade').onclick=$('closeP').onclick=()=>{ $('panel').classList.remove('open'); $('shade').classList.remove('open'); };

function renderAll(){ renderTabs(); renderMenu(); renderPanel(); }
renderAll();
</script>
