<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>King Wings Menu</title>
<meta name="apple-mobile-web-app-title" content="KW Menu">
<meta name="application-name" content="King Wings Menu">
<meta name="theme-color" content="#0A4F3F">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;font:17px/1.5 -apple-system,system-ui,Segoe UI,sans-serif;background:linear-gradient(#1FA37F,#0A4F3F);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
.box{padding:28px;max-width:420px}img{width:120px;height:120px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{font-size:24px;margin:18px 0 6px}a.b{display:inline-block;margin-top:18px;background:#fff;color:#0A4F3F;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:14px}
</style>
</head>
<body>
<div class="box">
<img src="icon-512.png" alt="King Wings Menu">
<h1>King Wings Menu</h1>
<p id="go" hidden>Открываю меню…</p>
<a class="b" id="open" href="#">Открыть</a>
</div>
<script>
// Куда ведёт значок — меняется только эта строка.
var T='https://trip.kingwingstravel-dmc.com/menu/';
document.getElementById('open').href=T;
if(/[?&]go=1/.test(location.search)){document.getElementById('open').hidden=true;document.getElementById('go').hidden=false;location.replace(T);}
else{try{history.replaceState(null,'','?go=1')}catch(e){}}
</script>
</body>
</html>
